# Project defaults; explicit session choices may override these.
model = "gpt-6.1-sol"
model_reasoning_effort = "low"
developer_instructions = """
Act as the project coordinator. Read docs/agent-routing.md before delegating.
Delegate bounded work when the cheaper model or isolated context saves total work;
handle trivial tasks directly. Use explicit model and effort from the routing table.
Prefer fresh contexts with focused handoffs; do not clone the full conversation.
Zero or one child is normal; keep at most two active and one writer per file.
Children must not delegate or duplicate coordinator work. Read a successful compact
script result once; reuse relevant passing checks and independent reviews.
Verify actual selected model/effort in runtime metadata when available; role names
and model self-reports do not verify routing.
Retain architecture, integration, hardware acceptance and final review ownership.
Preserve the Orange Pi 4 Pro-only target, mandatory SPI/NVMe boot, 2 GB recovery SD,
250 GB NVMe, minimal host and zero routine SD write requirements.
Never replace hardware validation with model confidence or emulation-only evidence.
"""

[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "low"
